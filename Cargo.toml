[workspace]
members = [
    "apps/toolkit",
    "crates/ui/toolkit-ui",
    "crates/formats/pam-codec",
    "crates/formats/particle-codec",
    "crates/formats/reanim-codec",
    "crates/formats/bnk-archive",
    "crates/formats/compiled-text",
    "crates/formats/crypt-data",
    "crates/formats/dzip-archive",
    "crates/formats/newton-manifest",
    "crates/formats/pak-archive",
    "crates/formats/rsb-archive",
    "crates/formats/rsb-patch",
    "crates/formats/serde-rton",
    "crates/formats/smf-container",
    "crates/formats/wem-audio",
    "crates/pam/core",
    "crates/pam/formats",
    "crates/pam/native-window",
    "crates/pam/renderer",
    "crates/pam/worker",
    "crates/rsb/worker",
    "crates/rsb-patch/worker",
    "crates/rton/core",
    "crates/rton/worker",
    "crates/smf/worker",
    "crates/wem/worker",
    "crates/tools/pam-tool",
    "crates/tools/crypt-data-tool",
    "crates/tools/particle-tool",
    "crates/tools/reanim-tool",
    "crates/tools/bnk-tool",
    "crates/tools/dzip-tool",
    "crates/tools/newton-tool",
    "crates/tools/pak-tool",
    "crates/tools/rsb-tool",
    "crates/tools/rsb-patch-tool",
    "crates/tools/rton-tool",
    "crates/tools/smf-tool",
    "crates/tools/wem-tool",
]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/LambdaEd1th/ed1ths-pvz-toolkit"
publish = false

[workspace.dependencies]
arboard = "3.6"
base64 = "0.23"
bnk-archive = { path = "crates/formats/bnk-archive", version = "0.1.0" }
bnk-tool = { path = "crates/tools/bnk-tool" }
bytemuck = { version = "1.24", features = ["derive"] }
byteorder = "1.5"
compiled-text = { path = "crates/formats/compiled-text", version = "0.1.0" }
console_error_panic_hook = "0.1"
crc32fast = "1.5"
crypt-data = { path = "crates/formats/crypt-data", version = "0.1.0" }
crypt-data-tool = { path = "crates/tools/crypt-data-tool" }
dioxus = { version = "0.7.10", default-features = false }
dioxus-free-icons = { version = "0.10", features = ["lucide"] }
dioxus-html = "0.7.10"
directories = "6"
dzip = { path = "crates/formats/dzip-archive", version = "0.5.1" }
dzip-tool = { path = "crates/tools/dzip-tool" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
fluent-bundle = "0.16"
futures-channel = "0.3"
futures-timer = "3"
futures-util = "0.3"
gloo-timers = { version = "0.4", features = ["futures"] }
hex = "0.4"
hound = "3.5"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
js-sys = "0.3"
log = { version = "0.4", features = ["std"] }
memmap2 = "0.9"
newton-manifest = { path = "crates/formats/newton-manifest", version = "0.1.0" }
newton-tool = { path = "crates/tools/newton-tool" }
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSColorSpace", "NSWindow"] }
ogg = "0.9.2"
pak-archive = { path = "crates/formats/pak-archive", version = "0.1.0" }
pak-tool = { path = "crates/tools/pak-tool" }
pam-codec = { path = "crates/formats/pam-codec", version = "0.1.2" }
pam-tool = { path = "crates/tools/pam-tool" }
pam_viewer_core = { path = "crates/pam/core" }
pam_viewer_formats = { path = "crates/pam/formats" }
pam_viewer_native_window = { path = "crates/pam/native-window" }
pam_viewer_renderer = { path = "crates/pam/renderer", default-features = false }
pam_viewer_worker = { path = "crates/pam/worker" }
parking_lot = "0.12"
particle-codec = { path = "crates/formats/particle-codec", version = "0.1.0" }
particle-tool = { path = "crates/tools/particle-tool" }
png = "0.18"
pollster = "1"
quick-xml = "0.41"
rayon = "1"
reanim-codec = { path = "crates/formats/reanim-codec", version = "0.1.0" }
reanim-tool = { path = "crates/tools/reanim-tool" }
regex = "1.13"
rfd = "0.17"
ropey = "1.6.1"
roxmltree = "0.21"
rsb-archive = { path = "crates/formats/rsb-archive", version = "0.1.0" }
rsb-patch = { path = "crates/formats/rsb-patch", version = "0.1.0" }
rsb-patch-tool = { path = "crates/tools/rsb-patch-tool" }
rsb-tool = { path = "crates/tools/rsb-tool" }
rsb_patch_worker = { path = "crates/rsb-patch/worker" }
rsb_preview_worker = { path = "crates/rsb/worker" }
rton-tool = { path = "crates/tools/rton-tool" }
rton_editor_core = { path = "crates/rton/core" }
serde = { version = "1", features = ["derive"] }
serde-rton = { path = "crates/formats/serde-rton", version = "0.4.0", default-features = false }
serde-wasm-bindgen = "0.6"
serde_bytes = "0.11"
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9.33"
smf-container = { path = "crates/formats/smf-container", version = "0.1.0" }
smf-tool = { path = "crates/tools/smf-tool" }
smf_worker = { path = "crates/smf/worker" }
symphonia = { version = "0.6", default-features = false, features = ["aac", "isomp4", "ogg", "vorbis"] }
tao = "0.34.8"
thiserror = "2"
toml = "1.1"
toolkit-ui = { path = "crates/ui/toolkit-ui" }
unic-langid = "0.9"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
wem-audio = { path = "crates/formats/wem-audio", version = "0.1.0" }
wem-tool = { path = "crates/tools/wem-tool" }
wem_audio_worker = { path = "crates/wem/worker" }
wgpu = { version = "30", features = ["webgl"] }
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs", "unreserved"] }

[patch."https://github.com/LambdaEd1th/rsb-archive.git"]
rsb-archive = { path = "crates/formats/rsb-archive" }

[patch."https://github.com/LambdaEd1th/smf-container.git"]
smf-container = { path = "crates/formats/smf-container" }

[profile.release]
lto = "thin"
opt-level = "s"
strip = true

[profile.release.package.dzip]
codegen-units = 1
opt-level = 3
