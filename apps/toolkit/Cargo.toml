[package]
name = "toolkit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The unified desktop and Web app for Ed1th's PvZ Toolkit"

[[bin]]
name = "pvz-toolkit"
path = "src/main.rs"

[package.metadata.bundle]
name = "Ed1th's PvZ Toolkit"
identifier = "io.github.lambdaed1th.pvz-toolkit"
category = "public.app-category.developer-tools"
short_description = "PvZ resource archive, data, animation, audio, and compression tools"
long_description = """
A cross-platform toolkit for inspecting, editing, converting, and previewing
Plants vs. Zombies resource formats.
"""
resources = ["assets/i18n"]

[package.metadata.bundle.bin.pvz-toolkit]
name = "Ed1th's PvZ Toolkit"
identifier = "io.github.lambdaed1th.pvz-toolkit"
category = "public.app-category.developer-tools"
short_description = "PvZ resource archive, data, animation, audio, and compression tools"
long_description = """
A cross-platform toolkit for inspecting, editing, converting, and previewing
Plants vs. Zombies resource formats.
"""

[dependencies]
base64.workspace = true
bnk-tool.workspace = true
compiled-text-tool.workspace = true
crypt-data-tool.workspace = true
dzip-tool.workspace = true
fluent-bundle.workspace = true
newton-tool.workspace = true
pak-tool.workspace = true
pam-tool.workspace = true
particle-tool.workspace = true
reanim-tool.workspace = true
rsb-tool.workspace = true
rsb-patch-tool.workspace = true
rton-tool.workspace = true
serde_json.workspace = true
smf-tool.workspace = true
toolkit-ui.workspace = true
unic-langid.workspace = true
wem-tool.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { workspace = true, features = ["desktop"] }
directories.workspace = true
futures-timer.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
pam_viewer_native_window.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
js-sys.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = ["Navigator", "Response", "Storage", "Window"] }
