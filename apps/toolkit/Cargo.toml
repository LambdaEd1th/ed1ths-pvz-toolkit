[package]
name = "toolkit-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "The unified desktop and Web app for Ed1th's PvZ Toolkit"

[[bin]]
name = "pvz-toolkit"
path = "src/main.rs"

[dependencies]
base64.workspace = true
bnk-tool.workspace = true
newton-tool.workspace = true
pak-tool.workspace = true
pam-tool = { path = "../../crates/tools/pam-tool" }
rsb-tool = { path = "../../crates/tools/rsb-tool" }
rton-tool = { path = "../../crates/tools/rton-tool" }
serde_json.workspace = true
toolkit-ui.workspace = true
wem-tool = { path = "../../crates/tools/wem-tool" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dioxus = { workspace = true, features = ["desktop"] }

[target.'cfg(target_os = "macos")'.dependencies]
pam_viewer_native_window = { path = "../../crates/pam/native-window" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
