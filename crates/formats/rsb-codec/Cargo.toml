[package]
name = "rsb-codec"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ed1th"]
categories = ["encoding", "parser-implementations"]
readme = "README.md"
license.workspace = true
repository.workspace = true
description = "Reader, writer, and texture codec support for PopCap/PvZ2 RSB bundles"

[features]
default = []
gpu = ["dep:bytemuck", "dep:futures-channel", "dep:wgpu"]

[dependencies]
byteorder = "1.5"
bytemuck = { workspace = true, optional = true }
flate2 = "1.1"
futures-channel = { workspace = true, optional = true }
image = { version = "0.25", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
wgpu = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = "1"
