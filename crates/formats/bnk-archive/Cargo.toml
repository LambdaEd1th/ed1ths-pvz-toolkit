[package]
name = "bnk-archive"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["ed1th"]
categories = ["encoding", "parser-implementations", "multimedia::audio"]
keywords = ["wwise", "bnk", "soundbank", "audio"]
readme = "README.md"
license.workspace = true
repository.workspace = true
description = "Lossless, version-aware reader and writer for Audiokinetic Wwise BNK sound banks"

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde_bytes"]

[dependencies]
byteorder.workspace = true
serde = { workspace = true, optional = true }
serde_bytes = { workspace = true, optional = true }
thiserror.workspace = true
