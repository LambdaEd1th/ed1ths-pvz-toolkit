[package]
name = "rsb-tool"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Internal RSB archive workspace for Ed1th's PvZ Toolkit"

[lib]
path = "src/lib.rs"

[dependencies]
base64.workspace = true
dioxus-free-icons.workspace = true
dioxus-html.workspace = true
image.workspace = true
pam_editor_core.workspace = true
pam_editor_formats.workspace = true
newton-manifest.workspace = true
serde-rton.workspace = true
serde_json.workspace = true
rsb_preview_worker.workspace = true
rsb-archive.workspace = true
toolkit-ui.workspace = true
zip.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard.workspace = true
dioxus = { workspace = true, features = ["desktop"] }
futures-channel.workspace = true
rayon.workspace = true
rfd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { workspace = true, features = ["web"] }
js-sys.workspace = true
gloo-timers.workspace = true
serde.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { workspace = true, features = [
    "Blob",
    "BlobPropertyBag",
    "Document",
    "File",
    "FileReader",
    "HtmlAnchorElement",
    "MessageEvent",
    "Url",
    "Window",
    "Worker",
    "WorkerOptions",
    "WorkerType",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster.workspace = true
