name: Release And Pages

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-pages-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DX_VERSION: 0.7.9
  WASM_PACK_VERSION: 0.15.0
  WEB_DIST: target/dx/pvz-toolkit/release/web/public

jobs:
  build_native:
    name: Build Native (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: pvz-toolkit-linux-x86_64
            binary: pvz-toolkit
            package_deb: true
          - os: ubuntu-24.04-arm
            artifact: pvz-toolkit-linux-aarch64
            binary: pvz-toolkit
            package_deb: true
          - os: macos-15
            artifact: pvz-toolkit-macos-aarch64
            binary: pvz-toolkit
            package_app: true
          - os: windows-2025-vs2026
            artifact: pvz-toolkit-windows-x86_64
            binary: pvz-toolkit.exe
            package_zip: true
          - os: windows-11-arm
            artifact: pvz-toolkit-windows-aarch64
            binary: pvz-toolkit.exe
            package_zip: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release --package toolkit-app --bin pvz-toolkit

      - name: Install cargo-bundle
        if: matrix.package_app == true || matrix.package_deb == true
        run: cargo install cargo-bundle --locked --version 0.10.0

      - name: Build macOS app bundle
        if: matrix.package_app == true
        run: cargo bundle --release --package toolkit-app --bin pvz-toolkit --format osx

      - name: Package macOS app bundle
        if: matrix.package_app == true
        run: |
          APP_PATH=$(find target/release/bundle/osx -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "${{ matrix.artifact }}-app-${{ github.ref_name }}.zip"

      - name: Build Debian package
        if: matrix.package_deb == true
        run: cargo bundle --release --package toolkit-app --bin pvz-toolkit --format deb

      - name: Package Debian bundle artifact
        if: matrix.package_deb == true
        run: |
          DEB_PATH=$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)
          test -n "$DEB_PATH"
          cp "$DEB_PATH" "${{ matrix.artifact }}-${{ github.ref_name }}.deb"

      - name: Package binary (Unix)
        if: matrix.package_zip == true && runner.os != 'Windows'
        run: |
          cp target/release/${{ matrix.binary }} ${{ matrix.binary }}
          zip -r ${{ matrix.artifact }}-${{ github.ref_name }}.zip ${{ matrix.binary }}

      - name: Package binary (Windows)
        if: matrix.package_zip == true && runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/${{ matrix.binary }} ${{ matrix.binary }}
          Compress-Archive -Path "${{ matrix.binary }}" -DestinationPath "${{ matrix.artifact }}-${{ github.ref_name }}.zip"

      - name: Upload binary artifact
        if: matrix.package_zip == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.zip

      - name: Upload macOS app artifact
        if: matrix.package_app == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-app
          path: ${{ matrix.artifact }}-app-${{ github.ref_name }}.zip

      - name: Upload Debian artifact
        if: matrix.package_deb == true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}-deb
          path: ${{ matrix.artifact }}-${{ github.ref_name }}.deb

  build_wasm:
    name: Build WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-${{ env.WASM_PACK_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1 || ! wasm-pack --version | grep -q "${WASM_PACK_VERSION}"; then
            cargo +stable install wasm-pack --version "${WASM_PACK_VERSION}" --locked
          fi

      - name: Build Web Runtime
        run: ./scripts/build-web-runtime.sh

      - name: Build WASM site
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RUSTUP_TOOLCHAIN=stable dx build \
            --platform web \
            --package toolkit-app \
            --release \
            --debug-symbols=false \
            --base-path "/${REPO_NAME}/"
          touch "${WEB_DIST}/.nojekyll"

      - name: Package web artifact
        run: |
          PACKAGE_NAME="pvz-toolkit-web-${{ github.ref_name }}.zip"
          cd "${WEB_DIST}"
          zip -r "${GITHUB_WORKSPACE}/${PACKAGE_NAME}" .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: pvz-toolkit-web
          path: pvz-toolkit-web-${{ github.ref_name }}.zip

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.WEB_DIST }}

  publish_release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build_native, build_wasm]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  deploy_pages:
    name: Deploy To GitHub Pages
    runs-on: ubuntu-latest
    needs: build_wasm
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
