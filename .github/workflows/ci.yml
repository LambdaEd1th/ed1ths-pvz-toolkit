name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  DX_VERSION: 0.7.10
  WASM_PACK_VERSION: 0.15.0

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Format
        run: cargo +stable fmt --all --check

      - name: Check native
        run: cargo +stable check --workspace --all-targets

      - name: Check wasm app
        run: cargo +stable check --package toolkit-app --target wasm32-unknown-unknown

      - name: Test
        run: cargo +stable test --workspace --all-targets

      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Free build artifacts
        if: always()
        run: cargo clean

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false

      - name: Cache Dioxus CLI
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/dx
          key: ${{ runner.os }}-dx-${{ env.DX_VERSION }}

      - name: Cache wasm-pack
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-${{ env.WASM_PACK_VERSION }}

      - name: Install Dioxus CLI
        run: |
          if ! command -v dx >/dev/null 2>&1 || ! dx --version | grep -q "dioxus ${DX_VERSION}"; then
            cargo +stable install dioxus-cli --version "${DX_VERSION}" --locked
          fi

      - name: Install wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null 2>&1 || ! wasm-pack --version | grep -q "${WASM_PACK_VERSION}"; then
            cargo +stable install wasm-pack --version "${WASM_PACK_VERSION}" --locked
          fi

      - name: Build Web Runtime
        run: ./scripts/build-web-runtime.sh

      - name: Build web
        run: RUSTUP_TOOLCHAIN=stable dx build --platform web --package toolkit-app --release --debug-symbols=false

      - name: Free build artifacts
        if: always()
        run: cargo clean
